# Configuration Apache pour HTTP/2 Server Push
# Permet de pousser les assets critiques au client avant qu'il les demande
# Améliore les temps de chargement en parallélisant les requêtes

# Attention: Cette configuration doit être incluse dans le VirtualHost Apache

<VirtualHost *:443>
    ServerName mtnpdv.local
    ServerAlias www.mtnpdv.local

    # ============================================
    # Activation HTTP/2
    # ============================================
    Protocols h2 http/1.1

    # ============================================
    # HTTP/2 Server Push - Assets Critiques
    # ============================================
    # Format: Link: <uri>; rel=preload; as=<type>

    # Bootstrap CSS (critique pour le rendu initial)
    Header always set Link "</vendor/bootstrap/css/bootstrap.min.css>; rel=preload; as=style"

    # Font Awesome CSS (icônes)
    Header always add Link "</vendor/fontawesome/css/all.min.css>; rel=preload; as=style"

    # Leaflet CSS (cartes)
    Header always add Link "</vendor/leaflet/css/leaflet.css>; rel=preload; as=style"

    # Dark Mode CSS (optimizations)
    Header always add Link "</css/dark-mode.css>; rel=preload; as=style"
    Header always add Link "</css/optimizations.css>; rel=preload; as=style"

    # Bootstrap JS Bundle
    Header always add Link "</vendor/bootstrap/js/bootstrap.bundle.min.js>; rel=preload; as=script"

    # Leaflet JS
    Header always add Link "</vendor/leaflet/js/leaflet.js>; rel=preload; as=script"

    # ============================================
    # Configuration par Route
    # ============================================

    # Pages d'administration
    <Location ~ ^/admin/>
        Header add Link "</vendor/bootstrap/css/bootstrap.min.css>; rel=preload; as=style"
        Header add Link "</vendor/fontawesome/css/all.min.css>; rel=preload; as=style"
        Header add Link "</vendor/bootstrap/js/bootstrap.bundle.min.js>; rel=preload; as=script"
    </Location>

    # Pages agent (cartes, visites)
    <Location ~ ^/agent/>
        Header add Link "</vendor/leaflet/css/leaflet.css>; rel=preload; as=style"
        Header add Link "</vendor/leaflet/js/leaflet.js>; rel=preload; as=script"
    </Location>

    # Pages gérant
    <Location ~ ^/gerant/>
        Header add Link "</vendor/bootstrap/css/bootstrap.min.css>; rel=preload; as=style"
        Header add Link "</vendor/bootstrap/js/bootstrap.bundle.min.js>; rel=preload; as=script"
    </Location>

    # Page login
    <Location ~ ^/login$>
        Header add Link "</vendor/bootstrap/css/bootstrap.min.css>; rel=preload; as=style"
        Header add Link "</vendor/bootstrap/js/bootstrap.bundle.min.js>; rel=preload; as=script"
    </Location>

    # ============================================
    # Cache & Compression
    # ============================================

    # Activation Gzip
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html
        AddOutputFilterByType DEFLATE text/plain
        AddOutputFilterByType DEFLATE text/xml
        AddOutputFilterByType DEFLATE text/css
        AddOutputFilterByType DEFLATE text/javascript
        AddOutputFilterByType DEFLATE application/javascript
        AddOutputFilterByType DEFLATE application/json
        AddOutputFilterByType DEFLATE application/xml+rss
    </IfModule>

    # Cache control headers
    <FilesMatch "\.(?:jpg|jpeg|png|gif|ico|css|js|svg|webp)$">
        Header set Cache-Control "max-age=31536000, public, immutable"
    </FilesMatch>

    <FilesMatch "\.(?:html|htm)$">
        Header set Cache-Control "max-age=3600, must-revalidate"
    </FilesMatch>

    # Webfonts
    <FilesMatch "\.(?:woff|woff2|ttf|eot)$">
        Header set Cache-Control "max-age=31536000, public"
        Header set Access-Control-Allow-Origin "*"
    </FilesMatch>

    # ============================================
    # Optimisations Performances
    # ============================================

    # Desactiver ETag pour meilleure compression
    <IfModule mod_headers.c>
        Header unset ETag
        FileETag None
    </IfModule>

    # ExpiresByType
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresDefault "access plus 1 week"

        # Images
        ExpiresByType image/jpeg "access plus 1 year"
        ExpiresByType image/png "access plus 1 year"
        ExpiresByType image/webp "access plus 1 year"
        ExpiresByType image/svg+xml "access plus 1 year"
        ExpiresByType image/x-icon "access plus 1 year"

        # CSS/JS
        ExpiresByType text/css "access plus 1 year"
        ExpiresByType application/javascript "access plus 1 year"
        ExpiresByType text/javascript "access plus 1 year"

        # Fonts
        ExpiresByType font/ttf "access plus 1 year"
        ExpiresByType font/otf "access plus 1 year"
        ExpiresByType font/woff "access plus 1 year"
        ExpiresByType font/woff2 "access plus 1 year"

        # HTML (dont cache longuement)
        ExpiresByType text/html "access plus 1 hour"
    </IfModule>

    # ============================================
    # Headers de Sécurité
    # ============================================
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Content Security Policy
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https:; connect-src 'self' https://tile.openstreetmap.org"

    # ============================================
    # Récriture d'URL (Symfony)
    # ============================================
    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^(.*)$ /index.php [QSA,L]
    </IfModule>

    # ============================================
    # Répertoires Racine
    # ============================================
    DocumentRoot /var/www/mtnpdv/public
    <Directory /var/www/mtnpdv/public>
        AllowOverride All
        Allow from All
    </Directory>

    # ============================================
    # SSL Configuration
    # ============================================
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/server.crt
    SSLCertificateKeyFile /etc/ssl/private/server.key
    SSLCertificateChainFile /etc/ssl/certs/chain.crt

    # SSL Protocols
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite HIGH:!aNULL:!MD5

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/mtnpdv-error.log
    CustomLog ${APACHE_LOG_DIR}/mtnpdv-access.log combined
</VirtualHost>

# HTTP to HTTPS redirect
<VirtualHost *:80>
    ServerName mtnpdv.local
    ServerAlias www.mtnpdv.local

    RewriteEngine On
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>
