# Configuration Nginx pour HTTP/2 Server Push
# Permet de pousser les assets critiques au client avant qu'il les demande
# Améliore les temps de chargement en parallélisant les requêtes

# Attention: Cette configuration doit être incluse dans le bloc 'server' de Nginx

# HTTP/2 Server Push pour assets critiques
# Format: link <uri>; rel=preload; as=<type>
# Types supportés: script, style, font, image, fetch, document

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    # ... Autres directives SSL ...

    # ============================================
    # HTTP/2 Server Push - Assets Critiques
    # ============================================

    # Bootstrap CSS (critque pour le rendu initial)
    add_header Link "</vendor/bootstrap/css/bootstrap.min.css>; rel=preload; as=style" always;

    # Font Awesome CSS (icônes)
    add_header Link "</vendor/fontawesome/css/all.min.css>; rel=preload; as=style" always;

    # Leaflet CSS (cartes)
    add_header Link "</vendor/leaflet/css/leaflet.css>; rel=preload; as=style" always;

    # Dark Mode CSS (optimizations)
    add_header Link "</css/dark-mode.css>; rel=preload; as=style" always;
    add_header Link "</css/optimizations.css>; rel=preload; as=style" always;

    # Bootstrap JS Bundle (requis pour Bootstrap)
    add_header Link "</vendor/bootstrap/js/bootstrap.bundle.min.js>; rel=preload; as=script" always;

    # Leaflet JS (cartes interactives)
    add_header Link "</vendor/leaflet/js/leaflet.js>; rel=preload; as=script" always;

    # Stimulus JS (framework)
    add_header Link "https://cdn.jsdelivr.net/npm/@hotwired/stimulus@3.2.2/+esm; rel=preload; as=script; crossorigin" always;

    # Turbo JS (navigation)
    add_header Link "https://cdn.jsdelivr.net/npm/@hotwired/turbo@8.0.5/+esm; rel=preload; as=script; crossorigin" always;

    # ============================================
    # HTTP/2 Server Push - Stratégie par route
    # ============================================

    # Pages d'administration (PDF exports, reports)
    location ~ ^/admin/ {
        # Tous les assets critiques pour admin
        http2_push /vendor/bootstrap/css/bootstrap.min.css;
        http2_push /vendor/fontawesome/css/all.min.css;
        http2_push /vendor/bootstrap/js/bootstrap.bundle.min.js;
        http2_push /css/dark-mode.css;
        http2_push /css/optimizations.css;

        # Ressources index.php
        try_files $uri /index.php$is_args$args;
    }

    # Pages agent (cartes, visites)
    location ~ ^/agent/ {
        # Assets pour cartes
        http2_push /vendor/leaflet/css/leaflet.css;
        http2_push /vendor/leaflet/js/leaflet.js;
        http2_push /vendor/bootstrap/css/bootstrap.min.css;
        http2_push /vendor/bootstrap/js/bootstrap.bundle.min.js;
        http2_push /css/dark-mode.css;
        http2_push /css/optimizations.css;

        try_files $uri /index.php$is_args$args;
    }

    # Pages gérant (kiosque)
    location ~ ^/gerant/ {
        http2_push /vendor/bootstrap/css/bootstrap.min.css;
        http2_push /vendor/bootstrap/js/bootstrap.bundle.min.js;
        http2_push /vendor/fontawesome/css/all.min.css;
        http2_push /css/dark-mode.css;
        http2_push /css/optimizations.css;

        try_files $uri /index.php$is_args$args;
    }

    # Page de login
    location ~ ^/login$ {
        http2_push /vendor/bootstrap/css/bootstrap.min.css;
        http2_push /vendor/bootstrap/js/bootstrap.bundle.min.js;
        http2_push /css/dark-mode.css;

        try_files $uri /index.php$is_args$args;
    }

    # Webfonts préchargement
    location ~ ^/vendor/fontawesome/fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # Assets avec longue durée de cache
    location ~ ^/vendor/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^/(css|js)/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Images avec lazy-loading
    location ~ ^/images/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # ============================================
    # Optimisations de Cache & Compression
    # ============================================

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/json application/javascript;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_vary on;

    # Brotli compression (meilleur que gzip)
    brotli on;
    brotli_comp_level 6;
    brotli_types text/plain text/css text/xml text/javascript
                 application/x-javascript application/xml+rss
                 application/json application/javascript;

    # Headers de sécurité
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy pour dark mode (permet inline styles)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https:; connect-src 'self' https://tile.openstreetmap.org" always;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name _;

    return 301 https://$host$request_uri;
}
