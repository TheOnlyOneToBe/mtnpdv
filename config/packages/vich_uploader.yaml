vich_uploader:
  db_driver: orm
  mappings:
    photos_utilisateur:
      uri_prefix: /uploads/profils
      upload_destination: '%kernel.project_dir%/public/uploads/profils'
      namer:
        service: Vich\UploaderBundle\Naming\UniqidNamer

    photos_visite:
      uri_prefix: /uploads/preuves
      upload_destination: '%kernel.project_dir%/public/uploads/preuves'
      namer:
        service: Vich\UploaderBundle\Naming\UniqidNamer

    photos_pos:
      uri_prefix: /uploads/pos
      upload_destination: '%kernel.project_dir%/public/uploads/pos'
      namer:
        service: Vich\UploaderBundle\Naming\UniqidNamer
