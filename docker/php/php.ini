; Surcharges PHP pour l'environnement Docker de MTNPDV

date.timezone = Africa/Douala
memory_limit = 256M

; Uploads (photos profil / preuve visite / POS)
upload_max_filesize = 10M
post_max_size = 12M
max_file_uploads = 20

; Opcache
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Erreurs (surchargé plus strictement en prod via APP_ENV/APP_DEBUG côté Symfony)
display_errors = Off
log_errors = On
