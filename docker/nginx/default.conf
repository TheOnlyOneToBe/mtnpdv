server {
    listen 80;
    server_name _;
    root /var/www/symfony/public;  # Adapté pour Docker (correspond au volume monté)

    client_max_body_size 12m;

    # Gestion des fichiers statiques
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Gestion des fichiers PHP (point d'entrée principal)
    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;  # "php" est le nom du service dans docker-compose
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        
        # Paramètres additionnels pour Symfony
        fastcgi_param APP_ENV prod;
        fastcgi_param APP_DEBUG 0;
        fastcgi_param HTTPS off;
        
        internal;
    }

    # Empêche l'exécution directe de tout autre fichier .php
    location ~ \.php$ {
        return 404;
    }

    # Cache des assets statiques
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Protection des fichiers sensibles
    location ~ /\.(env|git|gitignore|docker-compose\.yml|Dockerfile|htaccess|htpasswd)$ {
        deny all;
    }

    # Gestion des erreurs
    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}